<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synced — Onboarding</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 700px at 50% 0%, #161616 0%, #0a0a0a 55%, #050505 100%);
      font-family: -apple-system, "SF Pro Text", "SF Pro", system-ui, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px; box-sizing: border-box;
    }
    /* Mono digits */
    .mono {
      font-family: "SF Mono", ui-monospace, "Menlo", monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    /* Disable text selection on UI chrome */
    button, .no-select { user-select: none; -webkit-user-select: none; }

    /* Subtle screen-fade transition */
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .screen-fade { animation: screenIn 320ms cubic-bezier(.2,.7,.2,1) both; }

    @keyframes pulseRing {
      0%   { box-shadow: 0 0 0 0 rgba(0,229,255,.45); }
      70%  { box-shadow: 0 0 0 14px rgba(0,229,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,229,255,0); }
    }

    /* Range / slider — we render custom but reuse this for input */
    input[type="range"].syn {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 44px; background: transparent;
    }
    input[type="range"].syn::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 32px; height: 32px; border-radius: 50%;
      background: #00E5FF;
      border: 4px solid #0a0a0a;
      box-shadow: 0 0 0 1px rgba(0,229,255,.6), 0 0 24px rgba(0,229,255,.45);
      cursor: grab;
    }
    input[type="range"].syn:active::-webkit-slider-thumb { cursor: grabbing; }
    input[type="range"].syn::-moz-range-thumb {
      width: 32px; height: 32px; border-radius: 50%;
      background: #00E5FF; border: 4px solid #0a0a0a;
      box-shadow: 0 0 0 1px rgba(0,229,255,.6), 0 0 24px rgba(0,229,255,.45);
      cursor: grab;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="synced-components.jsx"></script>
  <script type="text/babel" src="synced-screens.jsx"></script>
  <script type="text/babel" src="synced-app.jsx"></script>
</body>
</html>
