name: Synced
options:
  bundleIdPrefix: com.ubay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Set in Xcode > Synced target > Signing & Capabilities > Team
    # (or paste your 10-char Team ID here so it persists across xcodegen runs).
    DEVELOPMENT_TEAM: "M28WFXT445"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Synced:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Synced
        excludes:
          - "Assets.xcassets/**/.gitkeep"
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Synced/Info.plist
      properties:
        CFBundleDisplayName: Synced
        UILaunchScreen:
          UIColorName: LaunchBg
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ubay.synced
        PRODUCT_NAME: Synced
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
